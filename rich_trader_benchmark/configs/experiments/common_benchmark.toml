schema_version = 1
protocol_status = "draft"

[inputs]
datasets = ["UNI1", "UNI2", "UNI3", "UNI4", "UNI5", "UNI6"]
k_values = [3, 4, 5, 6]
coloring_instances = [40, 80]
independent_seed_sets = 3
timing_repetitions = 3
checkpoint_percentages = [0, 1, 5, 10, 25, 50, 75, 100]

[development_split]
smoke_dataset = "UNI1"
development_datasets = ["UNI1", "UNI2", "UNI3"]
held_out_final_datasets = ["UNI4", "UNI5", "UNI6"]

[fairness]
same_logical_graph_state = true
same_k = true
same_color_assignments = true
same_seed_manifest = true
group_directed_updates_by_event_id = true
separate_preprocessing_from_detection = true
separate_initialization_from_online_updates = true
single_machine_per_comparison = true

[correctness_gate]
compare_cycle_weight = true
compare_relative_error = true
absolute_weight_tolerance = 1e-9
relative_weight_tolerance = 1e-9
compare_canonical_cycle_when_unique = true
allow_different_cycles_with_tied_weight = true

[metrics]
cycle_weight = true
relative_error = true
detection_time = true
initialization_time = true
update_time_median = true
update_time_p95 = true
update_time_p99 = true
maximum_memory_consumption = true
dp_table_memory = true
throughput_updates_per_second = true

[resource_policy]
timeout_seconds = 3600
record_tle = true
record_oom = true
continue_with_smaller_configuration_after_failure = false

[reporting]
report_every_metric = true
report_all_failed_runs = true
report_median_and_dispersion = true
separate_development_and_final_results = true
primary_improvement_target = "lock after baseline profiling and before method tuning"
